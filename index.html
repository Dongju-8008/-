!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>맛지도 (TasteMap) - 전국 권역별 맛집 탐색기</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#FFF7ED', 100: '#FFEDD5', 500: '#F97316', 600: '#EA580C', 700: '#C2410C' }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .leaflet-popup-content-wrapper {
      border-radius: 1rem; padding: 4px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
    }
    .leaflet-popup-content { margin: 8px 12px; }

    #map {
      width: 100%;
      height: 100%;
      min-height: 320px;
      z-index: 10;
    }
    .custom-map-pin {
      background: transparent;
      border: none;
    }
    
    /* Mobile Map specific slide-up styles */
    #mapColumn {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (max-width: 767px) {
      #mapColumn {
        position: fixed; inset: 0; z-index: 50;
        transform: translateY(100%);
        display: block !important;
      }
      #mapColumn.active {
        transform: translateY(0);
      }
    }

    @keyframes roulettePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .roulette-anim {
      animation: roulettePulse 0.15s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-dvh flex flex-col antialiased overflow-hidden">

  <header class="flex-none z-40 bg-white border-b border-slate-200 shadow-sm transition-all">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between py-3 gap-3">
        
        <!-- Top Row on Mobile: Logo & Actions -->
        <div class="flex w-full sm:w-auto items-center justify-between gap-3">
          <!-- Logo -->
          <div class="flex items-center space-x-2.5 cursor-pointer select-none" onclick="resetApp()">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20 shrink-0">
              <i class="fa-solid fa-utensils text-base sm:text-lg"></i>
            </div>
            <div class="min-w-0">
              <div class="font-extrabold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-orange-600 via-amber-600 to-rose-600 bg-clip-text text-transparent truncate">
                맛지도 <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-orange-100 text-orange-700 ml-1">v11</span>
              </div>
              <p class="text-[10px] sm:text-[11px] text-slate-500 -mt-0.5 truncate hidden sm:block">전국 핫플 맛집 탐색기</p>
            </div>
          </div>

          <!-- Actions (Mobile & Desktop) -->
          <div class="flex items-center space-x-2 shrink-0">
            <button onclick="openModal('addRestaurantModal')" class="flex items-center space-x-1 px-2.5 py-1.5 sm:px-3 bg-orange-50 text-orange-600 rounded-xl font-semibold text-xs border border-orange-200 hover:bg-orange-100 transition">
              <i class="fa-solid fa-plus"></i><span class="hidden sm:inline">맛집 등록</span>
            </button>
            <button onclick="openModal('rouletteModal')" class="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center bg-rose-50 text-rose-500 rounded-xl hover:bg-rose-100 transition" title="오늘 뭐 먹지?">
              <i class="fa-solid fa-dice text-base"></i>
            </button>
          </div>
        </div>

        <!-- Bottom Row on Mobile: Region Selects -->
        <div class="flex items-center gap-1.5 bg-slate-50 p-1.5 rounded-xl border border-slate-200 w-full sm:w-auto shrink-0">
          <div class="flex items-center justify-center w-6 text-orange-500 text-sm shrink-0">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <select id="regionMacroSelect" onchange="onMacroRegionChange()" class="bg-white border border-slate-200 rounded-lg font-medium text-xs text-slate-700 py-1.5 px-2 outline-none w-1/2 sm:w-32 shadow-sm appearance-none">
            <option value="all">전국 전체</option>
            <option value="seoul">서울</option>
            <option value="gyeonggi_incheon">경기/인천</option>
            <option value="gangwon">강원</option>
            <option value="daejeon_chungcheong">대전/충청</option>
            <option value="daegu_gyeongbuk">대구/경북</option>
            <option value="busan_gyeongnam">부산/경남</option>
            <option value="gwangju_jeonla">광주/전라</option>
            <option value="jeju">제주</option>
          </select>
          <select id="regionMicroSelect" onchange="applyFilters()" class="bg-white border border-slate-200 rounded-lg font-medium text-xs text-slate-700 py-1.5 px-2 outline-none w-1/2 sm:w-36 shadow-sm appearance-none">
            <option value="all">세부 권역 전체</option>
          </select>
        </div>
      </div>
      
      <!-- Category Chips -->
      <div class="flex items-center gap-2 py-2.5 overflow-x-auto no-scrollbar border-t border-slate-100" id="categoryContainer">
        <!-- Generated by JS -->
      </div>
    </div>
  </header>

  <main class="flex-1 min-h-0 w-full max-w-7xl mx-auto flex flex-col md:flex-row p-0 md:p-4 gap-0 md:gap-4 relative">
    
    <!-- Left Column: Restaurant List -->
    <div class="w-full md:w-[45%] lg:w-[40%] flex flex-col h-full bg-white md:rounded-3xl md:shadow-sm md:border md:border-slate-200 overflow-hidden relative">
      <div class="p-3 sm:p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 shrink-0">
        <h2 class="font-bold text-slate-700 text-sm sm:text-base">맛집 리스트 <span id="listCount" class="text-orange-500 ml-1">0</span></h2>
        <div class="flex gap-1.5 sm:gap-2">
          <button onclick="filterByRating('kakao')" class="text-[10px] sm:text-[11px] font-semibold px-2 py-1 bg-yellow-100 text-yellow-800 rounded-lg border border-yellow-200 active:scale-95 transition">카카오 4.0+</button>
          <button onclick="filterByRating('naver')" class="text-[10px] sm:text-[11px] font-semibold px-2 py-1 bg-green-100 text-green-800 rounded-lg border border-green-200 active:scale-95 transition">네이버 4.5+</button>
        </div>
      </div>
      
      <!-- List Scroll Area -->
      <div id="restaurantList" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-3 sm:space-y-4 custom-scrollbar bg-slate-50/30 pb-24 md:pb-4">
        <!-- List Items Generated by JS -->
      </div>

      <!-- Mobile FAB for Map -->
      <button onclick="toggleMobileMap()" class="md:hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-40 bg-slate-800/95 backdrop-blur text-white px-5 py-2.5 rounded-full font-bold text-sm shadow-xl shadow-slate-900/20 flex items-center gap-2 hover:bg-slate-700 active:scale-95 transition-transform border border-slate-700/50">
        <i class="fa-solid fa-map text-orange-400"></i> 지도 뷰 보기
      </button>
    </div>

    <!-- Right Column: Interactive Map -->
    <div id="mapColumn" class="flex-1 h-full md:rounded-3xl shadow-lg md:shadow-sm md:border md:border-slate-200 overflow-hidden relative bg-slate-100">
      <div id="map"></div>
      
      <!-- Mobile FAB for List (Inside Map View) -->
      <button onclick="toggleMobileMap()" class="md:hidden absolute bottom-8 left-1/2 -translate-x-1/2 z-[1000] bg-white text-slate-800 px-5 py-2.5 rounded-full font-bold text-sm shadow-2xl flex items-center gap-2 hover:bg-slate-50 active:scale-95 transition-transform border border-slate-200">
        <i class="fa-solid fa-list text-orange-500"></i> 목록으로 돌아가기
      </button>
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 z-[1001] hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all flex flex-col max-h-[95vh] sm:max-h-[90vh]">
      <div class="relative h-48 sm:h-56 bg-slate-200 shrink-0 w-full">
        <img id="detailImg" src="" alt="Restaurant" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
        <button onclick="closeModal('detailModal')" class="absolute top-3 right-3 w-8 h-8 bg-black/30 backdrop-blur-md rounded-full text-white flex items-center justify-center hover:bg-black/50 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="absolute bottom-4 left-4 right-4">
          <div class="flex items-center gap-2 mb-1.5 flex-wrap">
            <span id="detailCategory" class="px-2 py-0.5 bg-orange-500 text-white text-[10px] sm:text-xs font-bold rounded"></span>
            <span id="detailRegion" class="text-white/90 text-[10px] sm:text-xs font-medium"></span>
          </div>
          <h3 id="detailName" class="text-xl sm:text-2xl font-bold text-white leading-tight break-keep"></h3>
        </div>
      </div>
      
      <div class="p-5 sm:p-6 overflow-y-auto custom-scrollbar bg-white">
        <div class="flex gap-3 mb-6">
          <div class="flex-1 bg-green-50/50 rounded-2xl p-3 border border-green-100 flex flex-col items-center justify-center">
            <span class="text-[10px] sm:text-xs font-bold text-green-700 mb-1">네이버 평점</span>
            <div class="text-lg sm:text-xl font-extrabold text-green-600"><i class="fa-solid fa-star text-sm mr-1"></i><span id="detailNaver"></span></div>
          </div>
          <div class="flex-1 bg-yellow-50/50 rounded-2xl p-3 border border-yellow-100 flex flex-col items-center justify-center">
            <span class="text-[10px] sm:text-xs font-bold text-yellow-800 mb-1">카카오 평점</span>
            <div class="text-lg sm:text-xl font-extrabold text-yellow-600"><i class="fa-solid fa-star text-sm mr-1"></i><span id="detailKakao"></span></div>
          </div>
        </div>
        
        <div class="space-y-4 text-sm bg-slate-50 p-4 rounded-2xl border border-slate-100">
          <div class="flex items-start gap-3 text-slate-600">
            <div class="w-6 h-6 rounded-full bg-orange-100 flex items-center justify-center shrink-0 mt-0.5">
              <i class="fa-solid fa-utensils text-[10px] text-orange-500"></i>
            </div>
            <div class="min-w-0">
              <span class="font-bold text-slate-800 block mb-0.5 text-xs">대표 메뉴</span>
              <span id="detailMenu" class="break-keep text-slate-600 leading-relaxed"></span>
            </div>
          </div>
          <div class="flex items-start gap-3 text-slate-600">
            <div class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center shrink-0 mt-0.5">
              <i class="fa-solid fa-location-dot text-[10px] text-blue-500"></i>
            </div>
            <div class="min-w-0 flex-1">
              <span class="font-bold text-slate-800 block mb-0.5 text-xs">주소</span>
              <span id="detailAddress" class="break-keep text-slate-600 leading-relaxed block"></span>
            </div>
          </div>
        </div>
        
        <div class="mt-6 grid grid-cols-2 gap-3">
          <button id="btnNaverMap" class="py-3.5 rounded-xl bg-[#03C75A] text-white font-bold text-[13px] hover:bg-[#02b350] transition shadow-md shadow-green-500/20 active:scale-95">
            네이버 지도
          </button>
          <button id="btnKakaoMap" class="py-3.5 rounded-xl bg-[#FEE500] text-[#000000] font-bold text-[13px] hover:bg-[#ebd300] transition shadow-md shadow-yellow-500/20 active:scale-95">
            카카오맵
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Roulette Modal -->
  <div id="rouletteModal" class="fixed inset-0 z-[1002] hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-7 max-w-sm w-full text-center relative shadow-2xl border border-slate-100">
      <button onclick="closeModal('rouletteModal')" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-orange-500 to-rose-500 flex items-center justify-center text-white text-xl shadow-lg shadow-orange-500/20 mb-3">
        <i class="fa-solid fa-dice"></i>
      </div>
      <h3 class="text-lg sm:text-xl font-bold text-slate-800 mb-1">오늘 뭐 먹지?</h3>
      <p class="text-xs text-slate-500 mb-5 break-keep">현재 선택된 지역과 카테고리 내에서 검증된 찐맛집을 추천해 드립니다!</p>
      
      <div id="rouletteNotice" class="hidden text-xs text-rose-500 font-semibold bg-rose-50 p-2.5 rounded-xl mb-4 border border-rose-100"></div>

      <div class="h-36 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center mb-5 overflow-hidden relative p-3">
        <div id="roulettePlaceholder" class="text-slate-400 text-xs flex flex-col items-center gap-1.5">
          <i class="fa-solid fa-utensils text-slate-300 text-2xl"></i>
          <span>아래 버튼을 눌러 뽑기를 시작하세요!</span>
        </div>
        <div id="rouletteContent" class="hidden w-full flex flex-col items-center justify-center">
          <div id="rouletteCategory" class="text-[10px] font-bold px-2 py-0.5 rounded bg-orange-100 text-orange-600 mb-1.5"></div>
          <div id="rouletteResult" class="text-xl sm:text-2xl font-black text-slate-800 break-keep leading-tight mb-1">?</div>
          <div id="rouletteMenu" class="text-xs text-slate-500 truncate max-w-full"></div>
        </div>
      </div>
      
      <div class="space-y-2">
        <button id="btnSpinStart" onclick="spinRoulette()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-rose-500 hover:from-orange-600 hover:to-rose-600 text-white font-bold rounded-xl shadow-lg shadow-orange-500/25 active:scale-95 transition">
          <i class="fa-solid fa-shuffle mr-1.5"></i> 맛집 뽑기 시작!
        </button>
        <button id="btnRouletteDetail" onclick="viewRouletteWinner()" class="hidden w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition">
          상세 정보 보러가기
        </button>
      </div>
    </div>
  </div>

  <!-- Add Restaurant Modal -->
  <div id="addRestaurantModal" class="fixed inset-0 z-[1002] hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full relative max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl">
      <h3 class="text-lg font-bold text-slate-800 mb-1">내 찐맛집 추가하기</h3>
      <p class="text-[11px] text-slate-500 mb-5">나만의 숨겨진 맛집을 지도에 직접 등록해보세요.</p>
      
      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">상호명 *</label>
          <input type="text" id="addName" class="w-full border border-slate-200 rounded-xl p-2.5 outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 bg-slate-50 focus:bg-white transition" placeholder="예: 유치회관 본점">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">카테고리 *</label>
            <select id="addCategory" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 outline-none">
              <option value="한식">한식</option><option value="고기/구이">고기/구이</option><option value="일식/초밥">일식/초밥</option>
              <option value="회/해산물">회/해산물</option><option value="중식">중식</option><option value="양식">양식</option>
              <option value="카페">카페</option><option value="분식">분식</option><option value="기타">기타</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">지역(대분류) *</label>
            <select id="addMacro" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50 outline-none">
              <option value="seoul">서울</option><option value="gyeonggi_incheon">경기/인천</option>
              <option value="gangwon">강원</option><option value="daejeon_chungcheong">대전/충청</option>
              <option value="daegu_gyeongbuk">대구/경북</option><option value="busan_gyeongnam">부산/경남</option>
              <option value="gwangju_jeonla">광주/전라</option><option value="jeju">제주</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">주소 또는 위치 *</label>
          <input type="text" id="addAddress" class="w-full border border-slate-200 rounded-xl p-2.5 outline-none focus:border-orange-500 bg-slate-50" placeholder="예: 수원시 팔달구 인계동">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">추천 메뉴</label>
          <input type="text" id="addMenu" class="w-full border border-slate-200 rounded-xl p-2.5 outline-none focus:border-orange-500 bg-slate-50" placeholder="예: 선지해장국">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">네이버 평점 (선택)</label>
            <input type="number" id="addNaver" step="0.1" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50" placeholder="예: 4.5">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">카카오 평점 (선택)</label>
            <input type="number" id="addKakao" step="0.1" class="w-full border border-slate-200 rounded-xl p-2.5 bg-slate-50" placeholder="예: 4.0">
          </div>
        </div>
      </div>
      <div class="mt-8 flex gap-3">
        <button onclick="closeModal('addRestaurantModal')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600 font-bold transition">취소</button>
        <button onclick="saveCustomRestaurant()" class="flex-1 py-3 bg-orange-500 hover:bg-orange-600 rounded-xl text-white font-bold shadow-lg shadow-orange-500/30 transition">저장하기</button>
      </div>
    </div>
  </div>

  <script>
    const DB_VERSION = "4.0.0";

    function safeGetStorage(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeSetStorage(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }
    
    const regionConfig = {
      "seoul": [
        { id: "all", name: "전체" },
        { id: "gangnam", name: "강남/논현/신사/서초" },
        { id: "songpa", name: "송파/잠실/방이" },
        { id: "hongdae", name: "홍대/연남/마포/합정" },
        { id: "seongsu", name: "성수/건대/서울숲" },
        { id: "jongro", name: "종로/을지로/명동/용산" }
      ],
      "gyeonggi_incheon": [
        { id: "all", name: "전체" },
        { id: "suwon", name: "수원(인계/권선/세류/곡반정)" },
        { id: "gwanggyo", name: "광교(이의/하동/원천)" },
        { id: "seongnam", name: "성남/분당/판교/모란" },
        { id: "incheon", name: "인천(부평/구월/송도/신포)" },
        { id: "bucheon", name: "부천/시흥(배곧/정왕)" },
        { id: "ilsan", name: "일산/파주" }
      ],
      "gangwon": [
        { id: "all", name: "전체" },
        { id: "sokcho", name: "속초/강릉/양양/춘천" }
      ],
      "daejeon_chungcheong": [
        { id: "all", name: "전체" },

      { id:'JJ11', name:"만선식당 모슬포본점", macro:"jeju", micro:"jeju", category:"회/해산물", ratingNaver:4.6, ratingKakao:4.3, address:"제주 서귀포시 대정읍 하모항구로 44", lat:33.2189, lng:126.2512, menu:"원조 고등어회, 산낙지, 고등어조림" },
      { id:'JJ12', name:"명진전복", macro:"jeju", micro:"jeju", category:"회/해산물", ratingNaver:4.7, ratingKakao:4.4, address:"제주 제주시 구좌읍 해맞이해안로 1282", lat:33.5358, lng:126.8524, menu:"수요미식회 전복돌솥밥, 버터전복구이, 전복회" }
    ];

    let restaurants = [];
    let currentCategory = '전체';
    let currentRatingFilter = null;
    let map = null;
    let markerGroup = null;
    let selectedRouletteWinner = null;

    const categories = ['전체', '한식', '고기/구이', '일식/초밥', '회/해산물', '중식', '양식', '카페', '분식', '치킨', '기타'];

    const categoryImages = {
      '한식': 'https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&w=600&q=80',
      '고기/구이': 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80',
      '일식/초밥': 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=600&q=80',
      '회/해산물': 'https://images.unsplash.com/photo-1615141982883-c7ad0e69fd62?auto=format&fit=crop&w=600&q=80',
      '중식': 'https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80',
      '양식': 'https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=600&q=80',
      '카페': 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=600&q=80',
      '분식': 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80',
      '치킨': 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=600&q=80',
      '기타': 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=600&q=80'
    };

    function getRestaurantImage(r) {
      if (r && r.image) return r.image;
      return categoryImages[r ? r.category : '기타'] || categoryImages['기타'];
    }

    function initializeApp() {
      const storedVersion = safeGetStorage('tastemap_version');
      const storedData = safeGetStorage('tastemap_data');
      
      // Force refresh on DB_VERSION bump to ensure all 200+ verified restaurants are loaded
      if (storedVersion !== DB_VERSION || !storedData) {
        restaurants = [...seedData];
        saveData();
        safeSetStorage('tastemap_version', DB_VERSION);
      } else {
        try {
          restaurants = JSON.parse(storedData);
          const existingSeedIds = new Set(restaurants.map(r => r.id));
          const newSeedItems = seedData.filter(r => !existingSeedIds.has(r.id));
          if(newSeedItems.length > 0) {
            restaurants = [...restaurants, ...newSeedItems];
            saveData();
          }
        } catch(e) {
          restaurants = [...seedData];
          saveData();
        }
      }
      
      initCategories();
      initMap();
      
      setTimeout(() => {
        onMacroRegionChange();
      }, 150);

      window.addEventListener('resize', () => {
        if (map) map.invalidateSize();
      });
    }

    function saveData() {
      safeSetStorage('tastemap_data', JSON.stringify(restaurants));
    }

    function onMacroRegionChange() {
      const macroVal = document.getElementById('regionMacroSelect').value;
      const microSelect = document.getElementById('regionMicroSelect');
      microSelect.innerHTML = '';
      
      if (macroVal === 'all') {
        microSelect.innerHTML = '<option value="all">세부 권역 전체</option>';
        microSelect.disabled = true;
      } else {
        microSelect.disabled = false;
        const micros = regionConfig[macroVal] || [];
        micros.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          microSelect.appendChild(opt);
        });
      }
      applyFilters();
    }

    function initCategories() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `whitespace-nowrap px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-full text-[13px] sm:text-sm font-bold border transition-all shrink-0 ${
          cat === currentCategory 
          ? 'bg-slate-800 text-white border-slate-800 shadow-md shadow-slate-800/20' 
          : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'
        }`;
        btn.textContent = cat;
        btn.onclick = () => { currentCategory = cat; initCategories(); applyFilters(); };
        container.appendChild(btn);
      });
    }

    function filterByRating(type) {
      currentRatingFilter = (currentRatingFilter === type) ? null : type;
      applyFilters();
    }

    function applyFilters() {
      const macro = document.getElementById('regionMacroSelect').value;
      const micro = document.getElementById('regionMicroSelect').value;
      
      let filtered = restaurants;
      if (macro !== 'all') {
        filtered = filtered.filter(r => r.macro === macro);
        if (micro !== 'all') filtered = filtered.filter(r => r.micro === micro);
      }
      if (currentCategory !== '전체') {
        filtered = filtered.filter(r => r.category === currentCategory);
      }
      if (currentRatingFilter === 'kakao') filtered = filtered.filter(r => r.ratingKakao >= 4.0);
      else if (currentRatingFilter === 'naver') filtered = filtered.filter(r => r.ratingNaver >= 4.5);

      renderList(filtered);
      updateMapMarkers(filtered);
    }

    function renderList(list) {
      const listCountEl = document.getElementById('listCount');
      if(listCountEl) listCountEl.textContent = list.length;
      
      const container = document.getElementById('restaurantList');
      if(!container) return;
      container.innerHTML = '';
      
      if (list.length === 0) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-400 p-8 text-center mt-10">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
              <i class="fa-solid fa-face-frown text-2xl text-slate-300"></i>
            </div>
            <p class="font-bold text-slate-600 mb-1 text-sm">조건에 맞는 맛집이 없습니다</p>
            <p class="text-xs text-slate-400">다른 지역이나 카테고리를 선택해보세요.</p>
          </div>
        `;
        return;
      }
      
      list.forEach(r => {
        const foodImgUrl = getRestaurantImage(r);
        
        const card = document.createElement('div');
        card.className = "bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition cursor-pointer flex gap-3 sm:gap-4 items-center";
        card.onclick = () => openDetail(r);
        card.innerHTML = `
          <div class="w-20 h-20 sm:w-24 sm:h-24 shrink-0 rounded-2xl overflow-hidden bg-slate-100 shadow-inner relative">
            <img src="${foodImgUrl}" alt="${r.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='${categoryImages['한식']}'">
            <span class="absolute bottom-1 right-1 bg-black/60 backdrop-blur-sm text-white text-[9px] font-bold px-1.5 py-0.5 rounded">${r.category}</span>
          </div>
          <div class="flex-1 min-w-0 flex flex-col justify-center">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="text-[10px] font-extrabold bg-orange-50 text-orange-600 px-1.5 py-0.5 rounded border border-orange-100">${r.category}</span>
            </div>
            <h3 class="font-bold text-slate-800 text-[15px] sm:text-base truncate break-keep">${r.name}</h3>
            <p class="text-[11px] sm:text-xs text-slate-500 truncate mb-2 mt-0.5"><i class="fa-solid fa-utensils text-slate-300 mr-1.5"></i>${r.menu}</p>
            <div class="flex gap-2">
              <span class="text-[10px] sm:text-[11px] font-bold text-green-700 bg-green-50 px-1.5 py-0.5 rounded border border-green-100"><i class="fa-solid fa-star text-[9px] mr-0.5"></i>N ${r.ratingNaver}</span>
              <span class="text-[10px] sm:text-[11px] font-bold text-yellow-700 bg-yellow-50 px-1.5 py-0.5 rounded border border-yellow-100"><i class="fa-solid fa-star text-[9px] mr-0.5"></i>K ${r.ratingKakao}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function initMap() {
      const mapEl = document.getElementById('map');
      if (!mapEl) return;

      if (typeof L === 'undefined') {
        setTimeout(initMap, 200);
        return;
      }

      if (map) {
        try { map.remove(); } catch(e) {}
        map = null;
      }
      
      try {
        map = L.map('map', { 
          zoomControl: false,
          tap: false
        }).setView([36.5, 127.8], 7);
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        // Google Maps Official Korean Layer: 100% full Korean labels (hl=ko, gl=KR)
        // 대한민국 전역의 지하철역, 출구, 동/읍/면, 도로명이 완벽한 한국어로 표시됩니다.
        L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=ko&gl=KR&x={x}&y={y}&z={z}', {
          attribution: '&copy; Google Maps',
          subdomains: '0123',
          maxZoom: 20
        }).addTo(map);

        markerGroup = L.featureGroup().addTo(map);

        setTimeout(() => {
          if (map) map.invalidateSize();
        }, 300);
      } catch (e) {
        console.error("Map initialization failed", e);
      }
    }

    function updateMapMarkers(list) {
      if (!map || !markerGroup) return;
      markerGroup.clearLayers();
      if (!list || list.length === 0) return;
      
      list.forEach(r => {
        if (!r.lat || !r.lng) return;
        const iconHtml = `
          <div class="w-8 h-8 rounded-full bg-white border-2 border-orange-500 shadow-md flex items-center justify-center text-orange-600 font-black text-[11px] hover:scale-110 transition-transform">
            ${r.category.substring(0,1)}
          </div>
        `;
        const icon = L.divIcon({ 
          html: iconHtml, 
          className: 'custom-map-pin', 
          iconSize: [32, 32], 
          iconAnchor: [16, 16],
          popupAnchor: [0, -16]
        });
        const marker = L.marker([r.lat, r.lng], { icon }).addTo(markerGroup);
        
        marker.bindPopup(`
          <div class="text-xs p-1">
            <div class="font-bold text-slate-800 text-sm mb-0.5">${r.name}</div>
            <div class="text-[11px] text-orange-600 font-semibold mb-1">${r.category} · ${r.menu}</div>
            <div class="text-[11px] text-slate-500 mb-2 truncate">${r.address}</div>
            <button onclick="window.openDetailById('${r.id}')" class="w-full py-1.5 bg-orange-500 hover:bg-orange-600 text-white rounded-lg font-bold text-xs shadow-sm transition">상세보기</button>
          </div>
        `);
      });
      
      try { 
        const bounds = markerGroup.getBounds();
        if (bounds && bounds.isValid && bounds.isValid()) {
          map.fitBounds(bounds, { padding: [35, 35], maxZoom: 15 });
        }
      } catch(e) {
        console.warn("fitBounds failed", e);
      }

      setTimeout(() => { if (map) map.invalidateSize(); }, 100);
    }

    window.openDetailById = function(id) {
      const found = restaurants.find(r => r.id === id);
      if (found) openDetail(found);
    };

    function toggleMobileMap() {
      const mapCol = document.getElementById('mapColumn');
      if(mapCol) {
        mapCol.classList.toggle('active');
        setTimeout(() => { if (map) map.invalidateSize(); }, 100);
        setTimeout(() => { if (map) map.invalidateSize(); }, 350);
      }
    }

    function openDetail(r) {
      document.getElementById('detailName').textContent = r.name;
      document.getElementById('detailCategory').textContent = r.category;
      
      const macroSelect = document.querySelector(`#regionMacroSelect option[value="${r.macro}"]`);
      document.getElementById('detailRegion').textContent = macroSelect ? macroSelect.text : '';
      
      document.getElementById('detailNaver').textContent = r.ratingNaver;
      document.getElementById('detailKakao').textContent = r.ratingKakao;
      document.getElementById('detailMenu').textContent = r.menu;
      document.getElementById('detailAddress').textContent = r.address;
      
      const detailImgEl = document.getElementById('detailImg');
      detailImgEl.src = getRestaurantImage(r);
      detailImgEl.onerror = () => { detailImgEl.src = categoryImages[r.category] || categoryImages['기타']; };
      
      const exactNameQuery = encodeURIComponent(r.name);
      document.getElementById('btnNaverMap').onclick = () => window.open(`https://map.naver.com/v5/search/${exactNameQuery}`, '_blank');
      document.getElementById('btnKakaoMap').onclick = () => window.open(`https://map.kakao.com/link/search/${exactNameQuery}`, '_blank');
      
      openModal('detailModal');
    }

    function resetApp() {
      document.getElementById('regionMacroSelect').value = 'all';
      currentCategory = '전체';
      currentRatingFilter = null;
      onMacroRegionChange();
    }

    function openModal(id) { 
      const el = document.getElementById(id);
      if(el) el.classList.remove('hidden'); 
      if(id === 'rouletteModal') resetRouletteUI();
    }
    
    function closeModal(id) { 
      const el = document.getElementById(id);
      if(el) el.classList.add('hidden'); 
      if(id === 'rouletteModal') clearInterval(rouletteInterval);
    }

    function resetRouletteUI() {
      document.getElementById('rouletteNotice').classList.add('hidden');
      document.getElementById('roulettePlaceholder').classList.remove('hidden');
      document.getElementById('rouletteContent').classList.add('hidden');
      document.getElementById('btnRouletteDetail').classList.add('hidden');
      document.getElementById('btnSpinStart').disabled = false;
      document.getElementById('btnSpinStart').innerHTML = '<i class="fa-solid fa-shuffle mr-1.5"></i> 맛집 뽑기 시작!';
      selectedRouletteWinner = null;
    }

    let rouletteInterval;
    function spinRoulette() {
      const macroVal = document.getElementById('regionMacroSelect').value;
      const microVal = document.getElementById('regionMicroSelect').value;
      const noticeEl = document.getElementById('rouletteNotice');
      noticeEl.classList.add('hidden');
      
      let filtered = restaurants;
      if (macroVal !== 'all') filtered = filtered.filter(r => r.macro === macroVal);
      if (microVal !== 'all' && microVal !== undefined && microVal !== '') filtered = filtered.filter(r => r.micro === microVal);
      if (currentCategory !== '전체') filtered = filtered.filter(r => r.category === currentCategory);

      if(filtered.length === 0) {
        noticeEl.textContent = "현재 선택하신 필터 조건에 맞는 맛집이 없습니다. 지역이나 카테고리를 변경해 보세요!";
        noticeEl.classList.remove('hidden');
        return;
      }
      
      const placeholder = document.getElementById('roulettePlaceholder');
      const content = document.getElementById('rouletteContent');
      const resultEl = document.getElementById('rouletteResult');
      const catEl = document.getElementById('rouletteCategory');
      const menuEl = document.getElementById('rouletteMenu');
      const spinBtn = document.getElementById('btnSpinStart');
      const detailBtn = document.getElementById('btnRouletteDetail');
      
      placeholder.classList.add('hidden');
      content.classList.remove('hidden');
      detailBtn.classList.add('hidden');
      spinBtn.disabled = true;
      spinBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> 고민 중...';
      
      resultEl.classList.add('roulette-anim');
      
      let ticks = 0;
      clearInterval(rouletteInterval);
      
      rouletteInterval = setInterval(() => {
        const rand = filtered[Math.floor(Math.random() * filtered.length)];
        resultEl.textContent = rand.name;
        catEl.textContent = rand.category;
        menuEl.textContent = rand.menu;
        ticks++;
        
        if(ticks > 18) {
          clearInterval(rouletteInterval);
          resultEl.classList.remove('roulette-anim');
          selectedRouletteWinner = rand;
          
          resultEl.textContent = rand.name;
          catEl.textContent = rand.category;
          menuEl.textContent = rand.menu;
          
          spinBtn.disabled = false;
          spinBtn.innerHTML = '<i class="fa-solid fa-rotate-right mr-1.5"></i> 다시 뽑기';
          detailBtn.classList.remove('hidden');
        }
      }, 90);
    }

    function viewRouletteWinner() {
      if (selectedRouletteWinner) {
        closeModal('rouletteModal');
        openDetail(selectedRouletteWinner);
      }
    }

    function saveCustomRestaurant() {
      const name = document.getElementById('addName').value.trim();
      const cat = document.getElementById('addCategory').value;
      const mac = document.getElementById('addMacro').value;
      const addr = document.getElementById('addAddress').value.trim();
      const menu = document.getElementById('addMenu').value.trim() || '등록 메뉴 없음';
      const nav = parseFloat(document.getElementById('addNaver').value) || 0;
      const kak = parseFloat(document.getElementById('addKakao').value) || 0;
      
      if(!name || !addr) return;
      
      const newRest = {
        id: 'C' + Date.now(), name, category: cat, macro: mac, micro: "all",
        address: addr, ratingNaver: nav, ratingKakao: kak, menu,
        lat: 37.5 + (Math.random() * 0.1), lng: 127.0 + (Math.random() * 0.1)
      };
      
      restaurants.unshift(newRest);
      saveData();
      closeModal('addRestaurantModal');
      
      document.getElementById('regionMacroSelect').value = mac;
      currentCategory = cat;
      onMacroRegionChange();
    }

    window.onload = initializeApp;
  </script>
</body>
</html>
